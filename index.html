<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>راجعي مكتسباتك | التركيب النسبي المئوي</title>
<style>
:root{color-scheme:dark;--bg:#080f21;--panel:#14213c;--line:#304463;--txt:#f4f7ff;--muted:#b0c2df;--teal:#30d5b0;--gold:#f7c65a;--bad:#fa7386}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 80% 0%,#1a3655 0%,transparent 55%),var(--bg);color:var(--txt);min-height:100vh;padding:24px 16px;display:flex;flex-direction:column;align-items:center}.shell{width:min(750px,100%)}header{text-align:center;margin-bottom:20px}header small{display:block;color:var(--teal);letter-spacing:.3px;font-weight:bold}h1{font-size:clamp(25px,5vw,39px);margin:13px 0 8px}header p{color:var(--muted);margin:0;line-height:1.7}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#192b49,#101c33);border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 20px 65px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-size:14px;color:var(--muted)}.score{color:var(--gold);font-weight:bold}.track{height:9px;background:#071225;border-radius:20px;overflow:hidden;margin-bottom:26px}.progress{height:100%;background:linear-gradient(90deg,#1499c5,var(--teal));width:0;transition:width .3s}h2{font-size:clamp(18px,3vw,24px);line-height:1.9;margin:0 0 22px}.answers{display:grid;gap:11px}.option{border:1px solid #354c6c;background:#1a2a46;border-radius:13px;color:var(--txt);font-family:inherit;font-size:17px;padding:17px 16px;cursor:pointer;text-align:right;transition:background .15s,border-color .15s}.option:hover:not(:disabled){background:#234264;border-color:#6da3c2}.option.selected{border:2px solid #72bdf5;background:#213d5c}.option.correct{border:2px solid var(--teal);background:#163d3b}.option.wrong{border:2px solid var(--bad);background:#492436}.option:disabled{cursor:default}.actions{margin-top:23px;display:flex;gap:12px;flex-wrap:wrap}.primary{background:var(--teal);color:#072325;border:0;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer;flex:1}.primary:disabled{opacity:.4;cursor:not-allowed}.feedback{margin-top:18px;padding:15px 17px;background:#0c1930;border-radius:12px;line-height:1.9;border-right:4px solid var(--teal)}.feedback.bad{border-right-color:var(--bad)}.hidden{display:none!important}.result{text-align:center}.result .big{font-size:70px;margin:10px}.result h2{margin:12px 0}.result p{color:var(--muted);line-height:1.9}.identity{text-align:center;color:#c6d5ee;line-height:2;margin-top:25px;font-size:14px}.identity strong{color:#fff}@media(max-width:480px){.option{font-size:15px}.panel{padding:17px}}
</style>
</head>
<body>
<div class="shell"><header><small>التقويم التشخيصي | الفصل الخامس</small><h1>🧪 راجعي مكتسباتك</h1><p>4 أسئلة تفاعلية • 10 نقاط لكل إجابة صحيحة • تعلّمي من التغذية الراجعة</p></header>
<main class="panel"><section id="quiz"><div class="top"><span id="counter">السؤال 1 من 4</span><span class="score" id="score">⭐ 0 / 40 نقطة</span></div><div class="track"><div id="bar" class="progress"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" role="status"></div><div class="actions"><button id="confirm" class="primary" disabled>تأكيد الإجابة</button><button id="next" class="primary hidden">السؤال التالي ←</button></div></section><section class="result hidden" id="result"><div class="big">🏆</div><h2>اكتملت المراجعة!</h2><h1 id="finalScore"></h1><p id="finalMessage"></p><button class="primary" id="restart">إعادة المراجعة ↻</button></section></main>
<footer class="identity">إعداد المعلمة: <strong>أ. مشاعل القحطاني</strong><br>مديرة المدرسة: <strong>أ. منيرة العصيمي</strong><br>المدرسة الثانوية العشرون</footer></div>
<script>
const questions=[
{q:'ما المقصود بالتركيب النسبي المئوي للمركب؟',options:['نسبة عدد الذرات إلى عدد المولات','النسبة المئوية بالكتلة لكل عنصر في المركب','عدد الجزيئات في مول واحد','مجموع الكتل الذرية فقط'],answer:1,explain:'التركيب النسبي المئوي يعبّر عن النسبة المئوية بالكتلة لكل عنصر في المركب.'},
{q:'أي علاقة رياضية تُستخدم لحساب النسبة المئوية بالكتلة؟',options:['كتلة المركب ÷ كتلة العنصر × 100','كتلة العنصر × كتلة المركب','كتلة العنصر ÷ كتلة المركب × 100','عدد المولات ÷ 100'],answer:2,explain:'العلاقة الصحيحة هي: النسبة المئوية = (كتلة العنصر ÷ كتلة المركب) × 100.'},
{q:'عينة كتلتها 80 g تحتوي على 20 g من عنصر معين. ما نسبته المئوية؟',options:['20%','25%','40%','80%'],answer:1,explain:'20 ÷ 80 × 100 = 25%.'},
{q:'كم يساوي مجموع النسب المئوية بالكتلة لجميع عناصر المركب النقي؟',options:['50%','90%','100%','يعتمد على عدد العناصر'],answer:2,explain:'مجموع النسب المئوية لجميع عناصر المركب النقي يساوي دائمًا 100%.'}
];
let pos=0,selected=-1,locked=false,points=0;
const $=x=>document.getElementById(x);
function render(){const q=questions[pos];selected=-1;locked=false;$('counter').textContent=`السؤال ${pos+1} من ${questions.length}`;$('score').textContent=`⭐ ${points} / 40 نقطة`;$('bar').style.width=`${(pos+1)/questions.length*100}%`;$('question').textContent=q.q;$('answers').replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${['أ','ب','ج','د'][i]}. ${opt}`;b.onclick=()=>{if(locked)return;selected=i;document.querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i));$('confirm').disabled=false;};$('answers').appendChild(b)});$('confirm').disabled=true;$('confirm').classList.remove('hidden');$('next').classList.add('hidden');$('feedback').classList.add('hidden');}
$('confirm').onclick=()=>{if(locked||selected<0)return;locked=true;const q=questions[pos];if(selected===q.answer)points+=10;const buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,i)=>{b.disabled=true;b.classList.remove('selected');if(i===q.answer)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('score').textContent=`⭐ ${points} / 40 نقطة`;$('feedback').className=`feedback ${selected===q.answer?'':'bad'}`;$('feedback').textContent=`${selected===q.answer?'✅ إجابة صحيحة! +10 نقاط':'❌ إجابة غير صحيحة.'} ${q.explain}`;$('confirm').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=pos===questions.length-1?'عرض النتيجة النهائية':'السؤال التالي ←';};
$('next').onclick=()=>{if(pos===questions.length-1){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`${points} / 40 نقطة`;$('finalMessage').textContent=points===40?'إتقان كامل! أداء متميز.':points>=30?'أحسنتِ! مستوى ممتاز.':points>=20?'أداء جيد، راجعي المفاهيم التي أخطأتِ فيها.':'واصلي التدريب على حساب النسب المئوية.';}else{pos++;render();}};
$('restart').onclick=()=>{pos=0;selected=-1;locked=false;points=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();};
render();
</script>
</body></html>
